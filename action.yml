name: Setup QuickJS-ng
description: Download qjs, qjsc, and quickjs-amalgam from QuickJS-ng releases

inputs:
  version:
    description: Release tag to download (e.g. "v0.9.0"). Defaults to "latest".
    required: false
    default: latest

outputs:
  bindir:
    description: Directory containing qjs and qjsc executables
    value: ${{ steps.download-binaries.outputs.bindir }}
  amalgamdir:
    description: Directory containing quickjs-amalgam source files
    value: ${{ steps.download-amalgam.outputs.amalgamdir }}

runs:
  using: composite
  steps:
    - name: Determine platform
      id: platform
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"

        case "$OS" in
          Linux)
            case "$ARCH" in
              X64)   SUFFIX="linux-x86_64" ;;
              ARM64) SUFFIX="linux-aarch64" ;;
              *)     echo "Unsupported arch: $ARCH" && exit 1 ;;
            esac
            EXT=""
            ;;
          macOS)
            SUFFIX="darwin"
            EXT=""
            ;;
          Windows)
            case "$ARCH" in
              X64) SUFFIX="windows-x86_64" ;;
              X86) SUFFIX="windows-x86" ;;
              *)   echo "Unsupported arch: $ARCH" && exit 1 ;;
            esac
            EXT=".exe"
            ;;
          *)
            echo "Unsupported OS: $OS" && exit 1
            ;;
        esac

        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
        echo "ext=$EXT" >> "$GITHUB_OUTPUT"

    - name: Resolve download URL
      id: url
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          BASE="https://github.com/quickjs-ng/quickjs/releases/latest/download"
        else
          BASE="https://github.com/quickjs-ng/quickjs/releases/download/${VERSION}"
        fi
        echo "base=$BASE" >> "$GITHUB_OUTPUT"

    - name: Download qjs and qjsc
      id: download-binaries
      shell: bash
      run: |
        SUFFIX="${{ steps.platform.outputs.suffix }}"
        EXT="${{ steps.platform.outputs.ext }}"
        BASE="${{ steps.url.outputs.base }}"
        DEST="${{ runner.temp }}/quickjs-ng"

        mkdir -p "$DEST"

        curl -fsSL "$BASE/qjs-${SUFFIX}${EXT}" -o "$DEST/qjs${EXT}"
        curl -fsSL "$BASE/qjsc-${SUFFIX}${EXT}" -o "$DEST/qjsc${EXT}"

        if [ "${{ runner.os }}" != "Windows" ]; then
          chmod +x "$DEST/qjs" "$DEST/qjsc"
        fi

        echo "bindir=$DEST" >> "$GITHUB_OUTPUT"
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Download quickjs-amalgam
      id: download-amalgam
      shell: bash
      run: |
        BASE="${{ steps.url.outputs.base }}"
        DEST="${{ runner.temp }}/quickjs-ng/amalgam"

        mkdir -p "$DEST"

        curl -fsSL "$BASE/quickjs-amalgam.zip" -o "$DEST/../quickjs-amalgam.zip"
        unzip -o "$DEST/../quickjs-amalgam.zip" -d "$DEST"

        echo "QUICKJS_AMALGAM_DIR=$DEST" >> "$GITHUB_ENV"
        echo "amalgamdir=$DEST" >> "$GITHUB_OUTPUT"

    - name: Verify installation
      shell: bash
      run: |
        if command -v qjs && command -v qjsc; then
          echo "QuickJS-ng installed successfully"
        else
          echo "QuickJS-ng installation failed"
          exit 1
        fi