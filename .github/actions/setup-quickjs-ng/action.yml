name: Setup QuickJS-ng
description: Download qjs and qjsc from the latest QuickJS-ng release and add them to PATH

inputs:
  version:
    description: Release tag to download (e.g. "v0.9.0"). Defaults to "latest".
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Determine platform suffix
      id: platform
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"

        case "$OS" in
          Linux)
            case "$ARCH" in
              X64)   SUFFIX="linux-x86_64" ;;
              ARM64) SUFFIX="linux-aarch64" ;;
              *)     echo "Unsupported arch: $ARCH" && exit 1 ;;
            esac
            EXT=""
            ;;
          macOS)
            SUFFIX="darwin"
            EXT=""
            ;;
          Windows)
            case "$ARCH" in
              X64) SUFFIX="windows-x86_64" ;;
              X86) SUFFIX="windows-x86" ;;
              *)   echo "Unsupported arch: $ARCH" && exit 1 ;;
            esac
            EXT=".exe"
            ;;
          *)
            echo "Unsupported OS: $OS" && exit 1
            ;;
        esac

        echo "suffix=$SUFFIX"   >> "$GITHUB_OUTPUT"
        echo "ext=$EXT"         >> "$GITHUB_OUTPUT"

    - name: Resolve download base URL
      id: url
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          BASE="https://github.com/quickjs-ng/quickjs/releases/latest/download"
        else
          BASE="https://github.com/quickjs-ng/quickjs/releases/download/${VERSION}"
        fi
        echo "base=$BASE" >> "$GITHUB_OUTPUT"

    - name: Download qjs and qjsc
      shell: bash
      run: |
        SUFFIX="${{ steps.platform.outputs.suffix }}"
        EXT="${{ steps.platform.outputs.ext }}"
        BASE="${{ steps.url.outputs.base }}"
        DEST="${{ runner.temp }}/quickjs-ng"

        mkdir -p "$DEST"

        curl -fsSL "$BASE/qjs-${SUFFIX}${EXT}"  -o "$DEST/qjs${EXT}"
        curl -fsSL "$BASE/qjsc-${SUFFIX}${EXT}" -o "$DEST/qjsc${EXT}"

        # Make executable on Unix systems
        if [ "${{ runner.os }}" != "Windows" ]; then
          chmod +x "$DEST/qjs" "$DEST/qjsc"
        fi

        echo "$DEST" >> "$GITHUB_PATH"

    - name: Verify installation
      shell: bash
      run: |
        qjs --version
        qjsc --version
