name: Example QuickJS Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        id: setup-quickjs-ng

      - name: Run example.js with qjs
        shell: bash
        run: qjs example/example.js

      - name: Compile example.js to C with qjsc
        shell: bash
        run: qjsc -e -o example.c example/example.js

      - name: Verify C output exists
        shell: bash
        run: |
          if [ -f example.c ]; then
            echo "qjsc generated C output successfully"
          else
            echo "qjsc failed to generate C output"
            exit 1
          fi

      - name: Compile C code to executable (Unix)
        shell: bash
        if: runner.os != 'Windows'
        run: |
          gcc -o example_bin example.c "${QUICKJS_AMALGAM_DIR}/quickjs-amalgam.c" -I"${QUICKJS_AMALGAM_DIR}" -DQJS_BUILD_LIBC -lm
          chmod +x example_bin

      - name: Compile C code to executable (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $amalgamdir = $env:QUICKJS_AMALGAM_DIR
          gcc -o example_bin.exe example.c "$amalgamdir/quickjs-amalgam.c" -I"$amalgamdir" -DQJS_BUILD_LIBC -lm

      - name: Run compiled executable (Unix)
        shell: bash
        if: runner.os != 'Windows'
        run: ./example_bin

      - name: Run compiled executable (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          .\example_bin.exe